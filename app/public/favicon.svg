<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="awsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9900;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6600;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003D7A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#blueGradient)" stroke="#003D7A" stroke-width="2"/>
  
  <!-- AWS Cloud Symbol (simplified) -->
  <path d="M 30 40 Q 25 35 30 30 Q 40 28 45 35 Q 50 28 60 30 Q 70 32 70 40 Q 68 45 65 45 L 35 45 Q 32 45 30 40 Z" 
        fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Checkmark/Certificate Symbol -->
  <g transform="translate(50, 55)">
    <circle cx="0" cy="0" r="18" fill="url(#awsGradient)" stroke="#FF6600" stroke-width="1.5"/>
    <path d="M -8 0 L -3 6 L 8 -6" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Initials SAA (Small, top-right corner) -->
  <text x="72" y="22" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" opacity="0.9">
    SAA
  </text>
  
  <!-- C03 badge (small, bottom-left) -->
  <g transform="translate(20, 75)">
    <rect x="-8" y="-6" width="16" height="10" rx="2" fill="#FF9900" opacity="0.9"/>
    <text x="0" y="2" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      C03
    </text>
  </g>
</svg>
